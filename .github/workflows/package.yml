# The package as its users get it: installed with Composer on every supported version of PHP, once with the oldest
# dependencies it allows. Every example runs without an error and without a message of PHP, and every invoice the
# examples write passes the official rules of its format.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly: a new release of a dependency shows here without a change of the package.
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  examples:
    name: Examples (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          - php: '8.2'
            dependencies: lowest

    steps:
      - uses: actions/checkout@v5

      # The extensions the package requires, and iconv for the CSS parser of dompdf.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, mbstring, xmlreader, zlib, iconv
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install the package
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}

      - name: Run every example
        run: |
          failed=0
          for example in examples/*/*.php; do
            echo "::group::$example"
            output=$(php "$example" 2>&1) || { failed=1; echo "::error::$example ended with an error"; }
            echo "$output"
            if grep -Eq '\b(Warning|Notice|Deprecated|Fatal error)\b' <<< "$output"; then
              failed=1
              echo "::error::$example printed a message of PHP"
            fi
            echo "::endgroup::"
          done
          exit $failed

      # A rendering to read (shown-*) carries no invoice.
      - name: Check the invoices the examples wrote
        run: |
          php -r '
            require "vendor/autoload.php";
            $files = [...glob("examples/output/*.xml"), ...glob("examples/output/*.pdf")];
            $invalid = 0;
            foreach ($files as $file) {
                if (str_starts_with(basename($file), "shown-")) {
                    continue;
                }
                $report = (new Dealerweb\EInvoice\Validation\Validator())->validateFile($file);
                echo ($report->isValid() ? "valid    " : "INVALID  ") . basename($file) . PHP_EOL;
                $invalid += $report->isValid() ? 0 : 1;
            }
            exit($files === [] || $invalid > 0 ? 1 : 0);
          '
